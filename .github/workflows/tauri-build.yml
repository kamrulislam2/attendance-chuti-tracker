name: "Build & Release Tauri Desktop App"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: ''
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend static assets
        run: npm run build:tauri
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Build desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Chuti v__VERSION__"
          releaseBody: |
            ### Chuti v__VERSION__ 🚀

            #### 🌟 What's New in v0.1.5:
            - **Startup Hang & White Screen Resolution**: Bypassed PWA Service Worker (`sw.js`) registration inside the Tauri desktop environment and automatically unregistered old ones. This prevents asset resolution hangs that caused Windows/macOS apps to boot into a blank white screen.
            - **Safe Session Initialization**: Embedded a 4-second timeout protection (`Promise.race`) in Supabase getSession calls to prevent the app from getting stuck on "Loading, please wait..." during network start-up delays.
            - **macOS Bundle Warning Fix**: Switched tauri bundle identifier to `com.chuti.tracker` to avoid collision warnings on macOS.
            - **Dynamic Eid Holiday Cards**: Automatically display pending Eid-ul-Fitr and Eid-ul-Adha holiday cards on the user dashboard if they have remaining/unadjusted days (auto-hiding when fully adjusted or 0).
            - **Modal Loader Integrations**: Added clean loading spinner states to AddLeaveModal and AdminAddLeaveModal to eliminate rendering glitches and layout shifts.
            - **Database Schema Optimization**: Relocated `ALTER PUBLICATION` statements in schema.sql to run after table declarations, eliminating sql query initialization errors.

            #### 📦 Installation:
            - **Windows**: Download the `.exe` installer (x64), run it, and follow the setup wizard.
            - **macOS (Intel)**: Download the `x86_64` `.dmg`, drag to Applications.
            - **macOS (Apple Silicon)**: Download the `aarch64` `.dmg` (M1/M2/M3/M4), drag to Applications.

            *Developed by Kamrul Islam, IT Officer, B&F Corporate.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
