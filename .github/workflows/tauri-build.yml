name: "Build & Release Tauri Desktop App"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: ''
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend static assets
        run: npm run build:tauri
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Build desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Office Chuti Tracker v__VERSION__"
          releaseBody: |
            ### Office Chuti Tracker v__VERSION__ 🚀

            Welcome to version **v__VERSION__** of **Office Chuti Tracker**!

            This release introduces the **Tauri Auto-Updater** feature for desktop applications and fixes critical login connectivity bugs.

            #### 🌟 New in v0.1.1:
            - **Tauri Auto-Updater**: App now automatically checks for updates in the background. When a new version is detected, it downloads silently and shows a "Restart to Update" notification banner.
            - **CORS Login Resolution**: Fixed desktop login fetch failures by resolving endpoints dynamically to absolute Vercel endpoints and adding appropriate CORS responses on backend routes.
            - **Rust Dependency Stability**: Pinned `time` crate version to `0.3.47` in lockfiles to resolve a compilation regression.
            - **Custom Window Title**: Configured standard window title settings across builds.

            #### 📦 Installation:
            - **Windows**: Download the `.msi` or `.exe` installer (x64) from the Assets, run it, and follow the instructions.
            - **macOS (Intel)**: Download the `x86_64` `.dmg` installer, drag the app to your Applications folder, and run it.
            - **macOS (Apple Silicon)**: Download the `aarch64` `.dmg` installer (for M1/M2/M3/M4 Macs), drag the app to your Applications folder, and run it.
            *Note: On macOS, you may need to right-click and choose "Open" to bypass security warnings for unsigned apps.*
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
